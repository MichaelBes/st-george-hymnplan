<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Plan a Service — St. George Hymn Planner</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="topbar">
  <a href="index.html" class="home-link" title="Home">&#10014;</a>
  <div class="coptic-date">Plan a Service</div>
  <div class="gregorian-date">Build the hymn list for an upcoming service</div>
</div>

<main>
  <div class="service-bar">
    <label>Service date <input type="date" id="service-date" /></label>
    <span id="sync-status" class="sync-status"></span>
    <button id="sync-refresh" class="ghost">Refresh</button>
  </div>
  <div class="section-label">This Plan</div>
  <ul class="plan-list" id="plan-list">
    <li class="empty-state">No hymns added yet.</li>
  </ul>

  <div class="section-label">Hymn Library</div>
  <input type="text" id="search-box" placeholder="Search by title or tag…" style="margin-bottom: 14px;" />
  <div id="library-list"></div>

</main>

<nav class="bottom-nav">
  <a href="index.html">Today</a>
  <a href="plan.html" class="active">Plan a Service</a>
  <a href="communion.html">Communion Hymns</a>
</nav>

<script src="js/coptic-calendar.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/sync.js"></script>
<script src="js/plan.js"></script>
</body>
</html>
