<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Today — St. George Hymn Planner</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="topbar">
  <a href="index.html" class="home-link" title="Home">&#10014;</a>
  <div class="coptic-date" id="coptic-date">Loading…</div>
  <div class="gregorian-date" id="gregorian-date"></div>
</div>

<main>
  <div class="date-nav">
    <button id="open-date-modal">Change Date</button>
  </div>

  <div class="section-label">Synaxarium — Saints of the Day</div>
  <div id="saints-container">
    <p class="empty-state">Loading…</p>
  </div>

  <p class="empty-state" style="margin-top: 24px; font-size: 0.85rem;">
    Checked Coptic Reader and don't see this day's entry above yet?
    Add it to <code>data/saints.json</code> under key
    <code id="date-key-hint"></code>.
  </p>
</main>

<nav class="bottom-nav">
  <a href="index.html" class="active">Today</a>
  <a href="plan.html">Plan a Service</a>
  <a href="communion.html">Communion Hymns</a>
</nav>

<div class="modal-overlay" id="date-modal" style="display: none;">
  <div class="modal-card" id="modal-card">
    <div class="modal-preview">
      <div class="modal-preview-greg" id="preview-greg"></div>
      <div class="modal-preview-coptic" id="preview-coptic"></div>
    </div>
    <div class="modal-header">
      <button id="cal-prev-month">&lsaquo;</button>
      <span id="cal-month-label"></span>
      <button id="cal-next-month">&rsaquo;</button>
    </div>
    <div class="daynight-toggle">
      <button id="toggle-sun" class="daynight-btn" title="Before 7 PM">&#9728;&#65039;</button>
      <button id="toggle-moon" class="daynight-btn" title="After 7 PM">&#127769;</button>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
    <div class="modal-actions">
      <button id="live-btn">Live</button>
      <button id="save-btn" class="primary">Save</button>
    </div>
  </div>
</div>

<script src="js/coptic-calendar.js"></script>
<script src="js/app.js"></script>
<script>
let currentDate = getActiveDate();
let liveMode = isViewingLive();
let saintsData = null;

// Modal-local state — nothing here applies until "Save" is pressed.
let previewDate = currentDate;
let modalViewYear, modalViewMonth;
let modalDayNight = "sun";

async function renderForDate(date) {
  const coptic = gregorianToCoptic(date);
  const key = copticDateKey(coptic);

  document.getElementById("coptic-date").textContent = formatCoptic(coptic);
  document.getElementById("gregorian-date").textContent = formatGregorian(date);
  document.getElementById("date-key-hint").textContent = `"${key}"`;

  if (!saintsData) saintsData = await loadSaints();
  const entries = saintsData[key];

  const container = document.getElementById("saints-container");
  container.innerHTML = "";

  if (!entries || entries.length === 0) {
    container.innerHTML = `<p class="empty-state">No entry saved yet for this day. Check Coptic Reader and add it to saints.json.</p>`;
    return;
  }

  entries.forEach((saint) => {
    const el = document.createElement("div");
    el.className = "saint-entry";

    const hymnFlag = saint.hasHymn
      ? `<span class="hymn-flag yes">Dedicated hymn</span>`
      : `<span class="hymn-flag no">No dedicated hymn</span>`;

    const hymnList =
      saint.hasHymn && saint.hymnIds && saint.hymnIds.length
        ? `<ul class="hymn-list">${saint.hymnIds.map((id) => `<li>${id}</li>`).join("")}</ul>`
        : "";

    el.innerHTML = `
      <h2 class="saint-name">${saint.name}</h2>
      <p class="saint-summary">${saint.summary}</p>
      ${hymnFlag}
      ${hymnList}
    `;
    container.appendChild(el);
  });
}

/* ---------- Date picker modal ---------- */

function openDateModal() {
  const now = new Date();
  modalDayNight = liveMode ? (now.getHours() >= 19 ? "moon" : "sun") : "sun";
  previewDate = new Date(currentDate);
  modalViewYear = previewDate.getFullYear();
  modalViewMonth = previewDate.getMonth();
  updatePreview();
  renderCalendar();
  document.getElementById("date-modal").style.display = "flex";
}

function closeDateModal() {
  document.getElementById("date-modal").style.display = "none";
}

function updatePreview() {
  const effective = new Date(previewDate);
  if (modalDayNight === "moon") effective.setDate(effective.getDate() + 1);

  document.getElementById("preview-greg").textContent = effective.toLocaleDateString("en-US", {
    weekday: "short",
    month: "short",
    day: "numeric",
    year: "numeric"
  });
  document.getElementById("preview-coptic").textContent = formatCoptic(gregorianToCoptic(effective));

  document.getElementById("toggle-sun").classList.toggle("active", modalDayNight === "sun");
  document.getElementById("toggle-moon").classList.toggle("active", modalDayNight === "moon");
}

function renderCalendar() {
  const label = new Date(modalViewYear, modalViewMonth, 1).toLocaleDateString("en-US", {
    month: "long",
    year: "numeric"
  });
  document.getElementById("cal-month-label").textContent = label;

  const grid = document.getElementById("calendar-grid");
  grid.innerHTML = "";

  ["S", "M", "T", "W", "T", "F", "S"].forEach((d) => {
    const el = document.createElement("div");
    el.className = "dow";
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(modalViewYear, modalViewMonth, 1).getDay();
  const daysInMonth = new Date(modalViewYear, modalViewMonth + 1, 0).getDate();
  const today = new Date();

  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement("div");
    el.className = "day-cell empty";
    grid.appendChild(el);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const cellDate = new Date(modalViewYear, modalViewMonth, day);
    const el = document.createElement("button");
    el.className = "day-cell";
    el.textContent = day;
    if (cellDate.toDateString() === today.toDateString()) el.classList.add("today");
    if (cellDate.toDateString() === previewDate.toDateString()) el.classList.add("selected");
    el.addEventListener("click", () => {
      previewDate = cellDate;
      updatePreview();
      renderCalendar();
    });
    grid.appendChild(el);
  }
}

function saveSelection() {
  const effective = new Date(previewDate);
  if (modalDayNight === "moon") effective.setDate(effective.getDate() + 1);
  effective.setHours(0, 0, 0, 0);
  window.location.href = "index.html?date=" + formatDateInput(effective);
}

function goLive() {
  window.location.href = "index.html";
}

function init() {
  renderForDate(currentDate);
  propagateDateToNavLinks(currentDate, liveMode);

  document.getElementById("open-date-modal").addEventListener("click", openDateModal);
  document.getElementById("date-modal").addEventListener("click", (e) => {
    if (e.target.id === "date-modal") closeDateModal();
  });

  document.getElementById("cal-prev-month").addEventListener("click", () => {
    modalViewMonth--;
    if (modalViewMonth < 0) {
      modalViewMonth = 11;
      modalViewYear--;
    }
    renderCalendar();
  });

  document.getElementById("cal-next-month").addEventListener("click", () => {
    modalViewMonth++;
    if (modalViewMonth > 11) {
      modalViewMonth = 0;
      modalViewYear++;
    }
    renderCalendar();
  });

  document.getElementById("toggle-sun").addEventListener("click", () => {
    modalDayNight = "sun";
    updatePreview();
  });

  document.getElementById("toggle-moon").addEventListener("click", () => {
    modalDayNight = "moon";
    updatePreview();
  });

  document.getElementById("save-btn").addEventListener("click", saveSelection);
  document.getElementById("live-btn").addEventListener("click", goLive);
}

init();
</script>
</body>
</html>
